[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "makeupmous-agentplat_jd395"
version = "0.1.0"
description = "对内容做归一化与分片比对，找出Agent 编排平台工程师·标注一致性与标注者偏差上的重复项并按相似度归并"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "makeupmous" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://makeupmous.github.io"
Repository = "https://github.com/makeupmous/agentplat_jd395"
Issues = "https://github.com/makeupmous/agentplat_jd395/issues"

[project.scripts]
agentplat_jd395 = "agentplat_jd395:main"

[tool.setuptools]
py-modules = ["agentplat_jd395"]
